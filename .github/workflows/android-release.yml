name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

env:
  CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL }}

jobs:
  android-aab:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_FILE: keystore.jks
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Validate runtime URL
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CAPACITOR_SERVER_URL" || { echo "Missing repository variable CAPACITOR_SERVER_URL"; exit 1; }
          case "$CAPACITOR_SERVER_URL" in
            https://*) ;;
            *) echo "CAPACITOR_SERVER_URL must use HTTPS"; exit 1 ;;
          esac

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          test -s "$ANDROID_KEYSTORE_FILE"

      - name: Install repository
        run: npm ci

      - name: Build Next.js app
        run: npm run build -w apps/mobile

      - name: Generate Capacitor Android project
        working-directory: apps/mobile
        run: npx --yes @capacitor/cli add android

      - name: Sync Capacitor Android
        working-directory: apps/mobile
        run: npx --yes @capacitor/cli sync android

      - name: Configure production signing
        working-directory: apps/mobile
        env:
          STORE_FILE: ${{ env.ANDROID_KEYSTORE_FILE }}
          STORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("android/app/build.gradle")
          text = path.read_text()
          signing = '''\n    signingConfigs {\n        release {\n            storeFile file(System.getenv("ANDROID_KEYSTORE_FILE") ?: "keystore.jks")\n            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n        }\n    }\n'''
          if "signingConfigs {" not in text:
              text = text.replace("android {", "android {" + signing, 1)
          text = text.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
          if "signingConfig signingConfigs.release" not in text:
              text = text.replace("buildTypes {", "buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }\n        ", 1)
          path.write_text(text)
          PY
          cp "$GITHUB_WORKSPACE/${ANDROID_KEYSTORE_FILE}" android/app/keystore.jks

      - name: Build signed AAB
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinetixfitt-android-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab

      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/android-v')
        with:
          files: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
