name: One-time maintenance fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'Ezequiell-26'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Repair nutrition micronutrient type
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/web/app/nutrition-engine.ts')
          text = path.read_text(encoding='utf-8')
          old = '''  micronutrients?: {\n    vitaminA?: number;\n    vitaminC?: number;\n    vitaminD?: number;\n    calcium?: number;\n    iron?: number;\n    potassium?: number;\n  };'''
          new = '''  micronutrients?: {\n    vitaminA?: number;\n    vitaminC?: number;\n    vitaminD?: number;\n    vitaminE?: number;\n    vitaminK?: number;\n    vitaminB6?: number;\n    vitaminB12?: number;\n    calcium?: number;\n    iron?: number;\n    potassium?: number;\n    magnesium?: number;\n    zinc?: number;\n    folate?: number;\n    choline?: number;\n    omega3?: number;\n    probiotics?: string;\n  };'''
          if old not in text:
              raise SystemExit('Expected nutrition micronutrient type was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Remove one-time workflow
        run: rm -f .github/workflows/maintenance-fix-nutrition.yml

      - name: Commit maintenance fix
        run: |
          git config user.name "KinetixFitt Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/app/nutrition-engine.ts .github/workflows/maintenance-fix-nutrition.yml
          git commit -m "fix(web): complete nutrition micronutrient type" || exit 0
          git push origin HEAD:main
