name: Maintenance - Web ESLint pin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pin-eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Pin Next-compatible ESLint
        run: npm install --save-dev --save-exact eslint@8.57.1 eslint-config-next@14.2.5 --prefix apps/web

      - name: Verify web checks
        run: |
          npm ci --prefix apps/web
          npm run typecheck --prefix apps/web
          npm run lint --prefix apps/web

      - name: Commit dependency fix and remove maintenance workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/maintenance-web-eslint.yml
          git add apps/web/package.json apps/web/package-lock.json .github/workflows/maintenance-web-eslint.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(web): align eslint with Next 14"
          git push origin main
