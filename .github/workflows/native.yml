name: Native

# Builds reproducibles de escritorio y móvil.
# Windows/macOS: Tauri (shell ligero, producción contra la URL HTTPS pública).
# Android/iOS: Capacitor, también contra la URL HTTPS pública.
# Los proyectos nativos se generan desde la fuente para evitar drift accidental.

on:
  push:
    tags: ["desktop-v*", "native-v*"]
  workflow_dispatch:

env:
  CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL }}

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install repository
        run: npm ci
      - name: Build lightweight Windows installer
        run: npm run desktop:build:win
      - name: Report Windows installer size
        shell: pwsh
        run: |
          Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" |
            ForEach-Object { "Tauri Windows installer: $($_.Name) — $([math]::Round($_.Length / 1MB, 2)) MB" }
      - uses: actions/upload-artifact@v4
        with:
          name: kinetixfitt-windows-tauri
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  mac-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install repository
        run: npm ci
      - name: Build lightweight macOS installer
        run: npm run desktop:build:mac
      - name: Report macOS installer size
        shell: bash
        run: |
          find apps/desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print0 |
            xargs -0 -n1 du -h
      - uses: actions/upload-artifact@v4
        with:
          name: kinetixfitt-macos-tauri
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg

  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Validate mobile runtime URL
        shell: bash
        run: test -n "$CAPACITOR_SERVER_URL"
      - name: Install repository
        run: npm ci
        working-directory: .
      - name: Generate Android project
        run: npx --yes @capacitor/cli add android
      - name: Sync Capacitor Android
        run: npx --yes @capacitor/cli sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Report Android APK size
        shell: bash
        run: |
          find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print0 |
            xargs -0 -n1 du -h
      - uses: actions/upload-artifact@v4
        with:
          name: kinetixfitt-android
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk

  ios-simulator:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Validate mobile runtime URL
        shell: bash
        run: test -n "$CAPACITOR_SERVER_URL"
      - name: Install repository
        run: npm ci
        working-directory: .
      - name: Install iOS Capacitor platform
        run: npm install @capacitor/ios@8.5.2 --no-save --package-lock=false
      - name: Generate iOS project
        run: npx --yes @capacitor/cli add ios
      - name: Sync Capacitor iOS
        run: npx --yes @capacitor/cli sync ios
      - name: Resolve iOS workspace
        shell: bash
        run: |
          set -euo pipefail
          test -f ios/App/App.xcworkspace/contents.xcworkspacedata
      - name: Build iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/Build/Products/Debug-iphonesimulator/App.app \
            build/KinetixFitt-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kinetixfitt-ios-simulator
          path: apps/mobile/build/KinetixFitt-iOS-Simulator.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-exe, mac-dmg, android-apk, ios-simulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
