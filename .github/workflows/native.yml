name: Native

# Build reproducible de escritorio y móvil.
# Windows/macOS: Electron. Android/iOS: Capacitor generado en el runner.
# Los proyectos nativos se generan desde la fuente para evitar drift accidental.

on:
  push:
    tags: ["desktop-v*", "native-v*"]
  workflow_dispatch:

env:
  CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL }}

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install repository
        run: npm ci
        working-directory: .
      - name: Build Windows installer
        run: npm run desktop:build:win
      - uses: actions/upload-artifact@v4
        with:
          name: kinetixfitt-windows
          path: apps/mobile/dist-electron/*.exe

  mac-dmg:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install repository
        run: npm ci
        working-directory: .
      - name: Build macOS installer
        run: npm run desktop:build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: kinetixfitt-macos
          path: apps/mobile/dist-electron/*.dmg

  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Validate mobile runtime URL
        shell: bash
        run: test -n "$CAPACITOR_SERVER_URL"
      - name: Install repository
        run: npm ci
        working-directory: .
      - name: Generate Android project
        run: npx --yes @capacitor/cli add android
      - name: Sync Capacitor Android
        run: npx --yes @capacitor/cli sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kinetixfitt-android
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk

  ios-simulator:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validate mobile runtime URL
        shell: bash
        run: test -n "$CAPACITOR_SERVER_URL"
      - name: Install repository
        run: npm ci
        working-directory: .
      - name: Install iOS Capacitor platform
        run: npm install @capacitor/ios@8.5.2 --no-save --package-lock=false
      - name: Generate iOS project
        run: npx --yes @capacitor/cli add ios
      - name: Sync Capacitor iOS
        run: npx --yes @capacitor/cli sync ios
      - name: Resolve iOS workspace
        shell: bash
        run: |
          set -euo pipefail
          test -f ios/App/App.xcworkspace/contents.xcworkspacedata
      - name: Build iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/Build/Products/Debug-iphonesimulator/App.app \
            build/KinetixFitt-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kinetixfitt-ios-simulator
          path: apps/mobile/build/KinetixFitt-iOS-Simulator.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-exe, mac-dmg, android-apk, ios-simulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
